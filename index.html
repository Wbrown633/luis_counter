<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #f0ece0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    overflow: hidden;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100vh;
    text-align: center;
  }

  .sign {
    background: #f0ece0;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sign-header {
    background: #1a1a1a;
    color: #ffc800;
    padding: clamp(18px, 4vw, 36px) clamp(24px, 5vw, 56px) clamp(14px, 3vw, 28px);
    border-bottom: 4px solid #ffc800;
  }

  .sign-header .eyebrow {
    font-size: clamp(11px, 1.2vw, 15px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #ffc800;
    opacity: 0.7;
    margin-bottom: 6px;
  }

  .sign-header h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(22px, 4.5vw, 48px);
    line-height: 1.1;
    color: #ffc800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .sign-header h1 .accent {
    color: #fff;
    display: block;
  }

  .counter-section {
    padding: clamp(28px, 5vw, 56px) clamp(24px, 6vw, 80px) clamp(24px, 4vw, 48px);
    background: #f0ece0;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .days-label {
    font-size: clamp(11px, 1.2vw, 15px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 10px;
  }

  .counter-box {
    background: #1a1a1a;
    border: 3px solid #1a1a1a;
    border-radius: 4px;
    display: inline-block;
    padding: clamp(12px, 2vw, 24px) clamp(28px, 5vw, 72px) clamp(8px, 1.5vw, 18px);
    margin: 0 auto 20px;
    min-width: clamp(200px, 40vw, 360px);
  }

  .counter-number {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(72px, 16vw, 180px);
    color: #ffc800;
    line-height: 1;
    display: block;
    letter-spacing: -0.02em;
  }

  .counter-sub {
    font-size: clamp(11px, 1.2vw, 15px);
    letter-spacing: 0.3em;
    color: rgba(255, 200, 0, 0.5);
    text-transform: uppercase;
    margin-top: -4px;
    display: block;
  }

  .divider {
    width: clamp(60px, 8vw, 100px);
    height: 3px;
    background: #1a1a1a;
    margin: clamp(20px, 3vw, 36px) auto;
  }

  .tagline {
    font-size: clamp(13px, 2vw, 22px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #333;
    line-height: 1.5;
  }

  .sign-footer {
    background: #e8410a;
    border-top: 4px solid #1a1a1a;
    padding: clamp(12px, 2vw, 22px) clamp(20px, 4vw, 48px) clamp(10px, 2vw, 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vw, 20px);
  }

  .warning-icon {
    width: clamp(22px, 3vw, 36px);
    height: clamp(22px, 3vw, 36px);
    background: #ffc800;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    flex-shrink: 0;
  }

  .footer-text {
    font-size: clamp(12px, 1.4vw, 18px);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #fff;
  }

  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #e8410a;
    border: 2px solid #1a1a1a;
    border-radius: 50%;
    width: clamp(48px, 6vw, 72px);
    height: clamp(48px, 6vw, 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(9px, 1vw, 13px);
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1.2;
    transform: rotate(12deg);
    z-index: 2;
  }

  .sign-wrap {
    position: relative;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="sign-wrap">
      <div class="sign">
        <div class="sign-header">
          <h1>
            Days Since Luis
            <span class="accent">Turned a Joke Deck<br>Into Bracket 4</span>
          </h1>
        </div>

        <div class="counter-section">
          <p class="days-label">Current Count</p>
          <div class="counter-box">
            <span class="counter-number" id="dayCount">0</span>
            <span class="counter-sub">days</span>
          </div>
          <div class="divider"></div>
          <p class="tagline">
            Every day without an incident<br>
            is a gift. Stay vigilant.
          </p>
        </div>

        <div class="sign-footer">
          <div class="warning-icon"></div>
          <p class="footer-text">This could happen again at any time</p>
          <div class="warning-icon"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const start = new Date('2026-05-28T00:00:00');
    function update() {
      const now = new Date();
      const diff = Math.floor((now - start) / 86400000);
      document.getElementById('dayCount').textContent = Math.max(0, diff);
    }
    update();
    setInterval(update, 60000);
  </script>
</body>
</html>
